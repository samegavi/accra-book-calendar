[build]
  publish = "public"

# Cache static assets aggressively, but never cache the HTML
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Redirect all paths to index.html (single-page app)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
